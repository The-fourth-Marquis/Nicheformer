# ============================================================================
# Configuration for preprocess_spatial.py
# ============================================================================
# Edit this file to match your dataset, then run:
#   ./run_preprocess_spatial.sh
#
# To use a different config file:
#   ./run_preprocess_spatial.sh /path/to/other_config.yaml
# ============================================================================

# ---------------------------------------------------------------------------
# Input / Output paths
# ---------------------------------------------------------------------------
raw_h5ad: "/mnt/172/wh/25-12/spatial/raw/cosmx_liver_full_h5ad_export/cosmx_CancerousLiver_fullvis.h5ad"
output_name: "nanostring_cosmx_human_liver_Cancerous.h5ad"
output_dir: "/mnt/172/wh/25-12/spatial/preprocessed"

# ---------------------------------------------------------------------------
# Ontology constants
# ---------------------------------------------------------------------------
# Available assay values:
#   COSMX_SPATIAL="EFO:0030029", XENIUM="EFO:0030046", MERFISH="EFO:0030062",
#   VISIUM="EFO:0010961", SLIDE_SEQ="EFO:0030004", STAR_MAP="EFO:0030061",
#   DISSOCIATED="unknown"
assay: "EFO:0030029"

# Available sex values:
#   MALE="PATO:0000384", FEMALE="PATO:0000383",
#   HERMAPHRODITE="PATO:0001340", UNKNOWN="unknown"
sex: "PATO:0000383"

# Available organism values: "NCBITaxon:9606" (human), "NCBITaxon:10090" (mouse)
organism: "NCBITaxon:9606"
organism_validator: "human"

# Available tissue values:
#   LIVER="UBERON:0002107", LUNG="UBERON:0002048", BRAIN="UBERON:0000955",
#   COLON="UBERON:0001155", BREAST="UBERON:0000310", etc.
tissue: "UBERON:0002107"

# Available suspension_type values: "na" (spatial), "cell" (dissociated)
suspension_type: "na"

tissue_type: "tissue"

# ---------------------------------------------------------------------------
# Dataset metadata
# ---------------------------------------------------------------------------
dataset_title: "nanostring_cosmx_human_liver_Cancerous"
donor_id: "CancerousLiver"
condition_id: "cancerous"

# ---------------------------------------------------------------------------
# Spatial coordinate column names in adata.obs
# ---------------------------------------------------------------------------
# CosMx:  "x_slide_mm", "y_slide_mm"
# Xenium: "x_location", "y_location"
# MERFISH: "x", "y"  (or "global_x", "global_y")
spatial_x_col: "x_slide_mm"
spatial_y_col: "y_slide_mm"

# ---------------------------------------------------------------------------
# Library key — groups cells for spatial neighbor computation
# ---------------------------------------------------------------------------
# "section" — all cells in one group
# "fov" — group by field of view
# "Run_Tissue_name" — group by tissue section (CosMx)
# "slide_ID_numeric" — group by slide (CosMx)
library_key: "fov"

# ---------------------------------------------------------------------------
# Train/test split strategy
# ---------------------------------------------------------------------------
# Best practice: split by whole FOV to prevent data leakage between
# train and test sets (cells from the same FOV share spatial context).
# Set to a column name (e.g., "fov", "Run_Tissue_name", "slide_ID_numeric")
# for group-level split, or set to null for random cell-level split.
split_column: "fov"
split_random_seed: 42
split_test_frac: 0.1
split_test_samples_frac: 0.2

# ---------------------------------------------------------------------------
# Niche composition radii (X_niche_{idx} computation)
# ---------------------------------------------------------------------------
# Set to null to skip X_niche computation (compute later in tokenization).
# CosMx (mm):   [0.027, 0.054, 0.081, 0.108, 0.135]
# Xenium (um):  [25, 50, 75, 100, 125]
# MERFISH (um): [50, 100, 150, 200, 250]
niche_radii: [0.027, 0.054, 0.081, 0.108, 0.135]

# ---------------------------------------------------------------------------
# Gene mapping
# ---------------------------------------------------------------------------
# If your H5AD has gene symbols as var_names, set map_genes: true to map
# them to Ensembl IDs via mygene. If it already has Ensembl IDs, set to false.
map_genes: true
gene_mapping_species: "human"
# If var_names are already Ensembl IDs but symbols are in a var column,
# set this to the column name (e.g., "gene_name"). Otherwise set to null.
gene_symbol_var_col: null

# ---------------------------------------------------------------------------
# Cell type column in adata.obs
# ---------------------------------------------------------------------------
cell_type_col: "cellType"

# ---------------------------------------------------------------------------
# Niche label column (optional)
# ---------------------------------------------------------------------------
# Set to null if not available.
niche_col: "niche"

# ---------------------------------------------------------------------------
# Batch column
# ---------------------------------------------------------------------------
batch_col: "slide_ID_numeric"

# ---------------------------------------------------------------------------
# Layer to use as raw counts
# ---------------------------------------------------------------------------
# Set to "counts" or similar if your H5AD has a specific layer. Set to null
# to use adata.X.
counts_layer: counts

# ---------------------------------------------------------------------------
# Additional obs columns to preserve
# ---------------------------------------------------------------------------
preserve_obs_cols: []

# ---------------------------------------------------------------------------
# Assay name for obs['assay'] column (used in tokenization for technology_dict)
# ---------------------------------------------------------------------------
# This string value goes into the 'assay' obs column before being mapped to
# an integer token ID via technology_dict.
# Examples: "CosMx", "Xenium", "MERFISH", "Visium"
assay_name: "CosMx"

# ---------------------------------------------------------------------------
# Model & gene ordering (post-validation)
# ---------------------------------------------------------------------------
# Path to model.h5ad — used to align gene order via concat.
# Set to null to skip gene reordering.
model_h5ad: "/root/code/25-12/nicheformer/data/model_means/model.h5ad"

# ---------------------------------------------------------------------------
# Technology-specific mean (post-validation)
# ---------------------------------------------------------------------------
# Path to the technology-specific mean .npy file.
# Set to null to skip loading.
technology_mean_path: "/root/code/25-12/nicheformer/data/model_means/cosmx_mean_script.npy"
# Technology name used for assay mapping (e.g., "CosMx", "Xenium", "MERFISH")
technology_name: "CosMx"

# ---------------------------------------------------------------------------
# Tokenization dictionaries (obs column → integer ID mapping)
# ---------------------------------------------------------------------------
# These map string labels in obs columns to integer token IDs used by
# the Nicheformer model. Set to null for a column to auto-generate from
# unique values in the data.
tokenization_dicts:
  # modality_dict: 'dissociated' → 3, 'spatial' → 4
  modality_dict:
    spatial: 4
    dissociated: 3
  # specie_dict: 'Homo sapiens' → 5, 'Mus musculus' → 6
  specie_dict:
    "Homo sapiens": 5
    "human": 5
    "Mus musculus": 6
    "mouse": 6
  # technology_dict: 'merfish' → 7, 'cosmx' → 8, 'visium' → 9, etc.
  technology_dict:
    "merfish": 7
    "MERFISH": 7
    "cosmx": 8
    "CosMx": 8
    "NanoString digital spatial profiling": 8
    "visium": 9
    "Visium": 9
    "10x 5' v2": 10
    "10x 3' v3": 11
    "10x 3' v2": 12
    "10x 5' v1": 13
    "10x 3' v1": 14
    "10x 3' transcription profiling": 15
    "10x transcription profiling": 15
    "10x 5' transcription profiling": 16
    "CITE-seq": 17
    "Smart-seq v4": 18
  # Set to null to auto-generate from unique values in the data
  author_cell_type_dict: null
  niche_dict: null
  region_dict: null

# ---------------------------------------------------------------------------
# Ready-to-tokenize output
# ---------------------------------------------------------------------------
# Directory to save the split-ready H5AD files (one per split).
# Set to null to skip the ready-to-tokenize step.
ready_to_tokenize_dir: "/mnt/172/wh/25-12/spatial/preprocessed/to_tokenize/CancerousLiver"
# Obs columns to keep in the ready-to-tokenize output.
tokenize_obs_cols:
  - "assay"
  - "organism"
  - "nicheformer_split"
  - "batch"
  - "niche"
  - "region"
  - "author_cell_type"
